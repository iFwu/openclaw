name: Fork CI artifacts

on:
  push:
    branches: [ifwu-fork]
  workflow_dispatch:
    inputs:
      verification_base:
        description: Base commit for focused source verification (empty skips verification)
        type: string
        default: ""
        required: false
      verification_tests:
        description: Space-separated test paths to run on GitHub (requires verification_base)
        type: string
        default: ""
        required: false
      verify_download:
        description: Verify downloaded artifacts on a fresh runner
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: fork-ci-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NOTIFY_DRY_RUN: "1"
  OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "0"

jobs:
  verify:
    if: github.repository == 'iFwu/openclaw' && github.event_name == 'workflow_dispatch' && inputs.verification_base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERIFICATION_BASE: ${{ inputs.verification_base }}
      VERIFICATION_TESTS: ${{ inputs.verification_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.8.1"
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: "off"
      - name: Prepare focused verification scope
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const base = process.env.VERIFICATION_BASE;
          if (!/^[a-f0-9]{40}$/.test(base)) throw new Error('verification_base must be a full commit SHA');
          execFileSync('git', ['merge-base', '--is-ancestor', base, 'HEAD']);
          const changed = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACMR', '-z', base, 'HEAD'], {encoding:'utf8'}).split('\0').filter(Boolean);
          const sources = changed.filter(p => p.endsWith('.ts') && p.startsWith('src/'));
          const tests = process.env.VERIFICATION_TESTS.trim().split(/\s+/).filter(Boolean);
          if (!sources.length || !tests.length) throw new Error('Source paths and explicit regression tests are required');
          for (const p of [...sources, ...tests]) {
            if (!/^src\/[a-zA-Z0-9_./-]+\.ts$/.test(p) || p.split('/').includes('..') || !fs.statSync(p).isFile()) throw new Error(`Invalid source path: ${p}`);
          }
          if (tests.some(p => !p.endsWith('.test.ts'))) throw new Error('Expected test file paths');
          const root = '.artifacts/fork-verification';
          fs.mkdirSync(root, {recursive:true});
          fs.writeFileSync(`${root}/scope.json`, JSON.stringify({sources,tests}));
          fs.writeFileSync(`${root}/tsconfig.json`, JSON.stringify({extends:'../../test/tsconfig/tsconfig.core.test.shard.json',compilerOptions:{incremental:false},include:[...new Set([...sources,...tests])].map(p=>'../../'+p),exclude:[]}));
          console.log(JSON.stringify({base,head:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sources,tests},null,2));
          NODE
      - name: Type check changed source and regression dependency graph
        run: node scripts/run-tsgo.mjs -p .artifacts/fork-verification/tsconfig.json
      - name: Type-aware lint and formatting
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {sources} = JSON.parse(fs.readFileSync('.artifacts/fork-verification/scope.json','utf8'));
          execFileSync('node',['scripts/run-oxlint.mjs','--tsconfig','config/tsconfig/oxlint.core.json',...sources],{stdio:'inherit'});
          execFileSync('pnpm',['exec','oxfmt','--check',...sources],{stdio:'inherit'});
          NODE
      - name: Run selected regression suites
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {tests} = JSON.parse(fs.readFileSync('.artifacts/fork-verification/scope.json','utf8'));
          execFileSync('node',['scripts/run-vitest.mjs',...tests],{stdio:'inherit'});
          NODE

  build:
    if: github.repository == 'iFwu/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.8.1"
          semantic-checks: "false"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Configure isolated verification state
        run: |
          echo "OPENCLAW_STATE_DIR=$RUNNER_TEMP/openclaw-ci-state" >> "$GITHUB_ENV"
          echo "OPENCLAW_CONFIG_PATH=$RUNNER_TEMP/openclaw-ci-state/openclaw.json" >> "$GITHUB_ENV"
      - name: Check tracked private keys
        run: node scripts/detect-private-keys.mts
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          export FORK_CI_OUTPUT="$RUNNER_TEMP/fork-ci-output"
          mkdir -p "$FORK_CI_OUTPUT"
          free -h
          /usr/bin/time -v -o "$FORK_CI_OUTPUT/build-time.txt" pnpm build
          node scripts/check-package-dist-imports.mjs
          node openclaw.mjs --version
          node --import ./scripts/tsx.mjs --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { listGeneratedExtensionAssetSources } from './scripts/lib/static-extension-assets.mts';
          const output = process.env.FORK_CI_OUTPUT;
          const declaredAssets = listGeneratedExtensionAssetSources();
          const missingAssets = declaredAssets.filter((p) => !fs.existsSync(p));
          if (missingAssets.length) {
            throw new Error(`Missing generated extension assets: ${missingAssets.join(', ')}`);
          }
          const outputs = ['dist', ...(fs.existsSync('dist-runtime') ? ['dist-runtime'] : []),
            ...fs.readdirSync('packages').map(name => `packages/${name}/dist`).filter(p => fs.existsSync(p)),
            ...declaredAssets];
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim();
          const info = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
          if (info.commit !== sha) throw new Error('Build provenance differs from checkout');
          const archive = `${output}/ci-artifacts.tar.gz`;
          execFileSync('tar', ['-czf', archive, '--null', '-T', '-'], {input: outputs.join('\0') + '\0'});
          const hash = createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
          fs.writeFileSync(`${output}/manifest.json`, JSON.stringify({sha, tree, profile: 'ciArtifacts',
            node: process.versions.node, platform: process.platform, arch: process.arch, sha256: hash, outputs, buildInfo: info}, null, 2) + '\n');
          NODE
      - name: Upload verified build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-ci-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/fork-ci-output/
          if-no-files-found: error
          retention-days: 7
      - name: Report runner resources
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/fork-ci-output/build-time.txt" ]]; then cat "$RUNNER_TEMP/fork-ci-output/build-time.txt"; fi
          free -h
          df -h .

  verify-download:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_download
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "26.8.1"
          semantic-checks: "false"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
      - name: Configure isolated verification state
        run: |
          echo "OPENCLAW_STATE_DIR=$RUNNER_TEMP/openclaw-ci-state" >> "$GITHUB_ENV"
          echo "OPENCLAW_CONFIG_PATH=$RUNNER_TEMP/openclaw-ci-state/openclaw.json" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-ci-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/fork-ci-download
      - name: Verify downloaded identity and restore outputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const root = `${process.env.RUNNER_TEMP}/fork-ci-download`;
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim();
          if (manifest.sha !== sha || manifest.tree !== tree || manifest.profile !== 'ciArtifacts' ||
            manifest.node !== process.versions.node || manifest.platform !== process.platform || manifest.arch !== process.arch)
            throw new Error('Artifact source/runtime identity mismatch');
          const archive = `${root}/ci-artifacts.tar.gz`;
          if (createHash('sha256').update(fs.readFileSync(archive)).digest('hex') !== manifest.sha256)
            throw new Error('Artifact checksum mismatch');
          execFileSync('tar', ['-xzf', archive]);
          const missingOutputs = manifest.outputs.filter((p) => !fs.existsSync(p));
          if (missingOutputs.length) {
            throw new Error(`Restored output missing: ${missingOutputs.join(', ')}`);
          }
          const info = JSON.parse(fs.readFileSync('dist/build-info.json', 'utf8'));
          if (info.commit !== sha || info.buildId !== manifest.buildInfo.buildId)
            throw new Error('Restored build provenance mismatch');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          let runtime = 0, types = 0;
          for (const [key, value] of Object.entries(pkg.exports)) {
            if (!key.startsWith('./plugin-sdk/')) continue;
            const js = typeof value === 'string' ? value : value.default ?? value.import;
            if (typeof js !== 'string' || !fs.existsSync(js)) throw new Error(`Missing SDK runtime: ${key}`);
            runtime++;
            if (typeof value === 'object' && value.types) {
              if (!fs.existsSync(value.types)) throw new Error(`Missing SDK types: ${key}`);
              types++;
            }
          }
          if (!runtime || !types || !fs.existsSync('dist/control-ui/index.html')) throw new Error('Incomplete SDK/UI artifacts');
          console.log(JSON.stringify({sha, buildId: info.buildId, runtime, types}));
          NODE
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify restored import closure and built CLI without rebuilding
        run: |
          node scripts/check-package-dist-imports.mjs
          node openclaw.mjs --version
